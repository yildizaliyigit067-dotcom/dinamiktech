<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinamik Tech</title>
<style>
  :root{
    --navy:#1a1c40; --panel:#23264f; --panel-2:#2b2e5e; --line:#363a6e;
    --ink:#f2f3fb; --muted:#9aa0c8; --accent:#5b6bf0; --accent-soft:#3a3f7d;
    --good:#3ddc97; --warn:#f5b94d; --bad:#ff6b81;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--navy);color:var(--ink);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:88px;
    background-image:radial-gradient(circle at 15% 0%, rgba(91,107,240,.12), transparent 40%),
                     radial-gradient(circle at 85% 5%, rgba(61,220,151,.06), transparent 35%);
    background-attachment:fixed;}
  header{background:rgba(26,28,64,.85);backdrop-filter:blur(12px);color:#fff;position:sticky;top:0;z-index:50;
    padding:13px 18px;display:flex;align-items:center;justify-content:space-between;
    padding-top:max(13px,env(safe-area-inset-top));border-bottom:1px solid var(--line);}
  .logo{height:26px;display:block;}
  .controls{display:flex;align-items:center;gap:8px;}
  .lang,.report-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:#fff;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;font-weight:600;}
  .report-btn{background:var(--accent);color:#fff;border:none;box-shadow:0 4px 14px rgba(91,107,240,.4);}
  .modepill{font-size:11px;background:rgba(61,220,151,.16);color:var(--good);border-radius:20px;
    padding:4px 10px;font-weight:700;}
  main{max-width:1040px;margin:0 auto;padding:18px 16px;}
  .row{display:grid;gap:12px;}
  h2.section{font-size:12px;color:var(--muted);font-weight:700;margin:26px 4px 12px;
    text-transform:uppercase;letter-spacing:.8px;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  @media(min-width:680px){.kpis{grid-template-columns:repeat(4,1fr);}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:0 2px 12px rgba(0,0,0,.18);}
  .kpi .label{color:var(--muted);font-size:12px;font-weight:600;margin-bottom:9px;}
  .kpi .val{font-size:27px;font-weight:800;letter-spacing:-.6px;color:#fff;line-height:1;}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:8px;}
  .kpi.hero{background:linear-gradient(135deg,#3a3f8f,#5b6bf0);border:none;
    box-shadow:0 8px 24px rgba(91,107,240,.35);}
  .kpi.hero .label{color:rgba(255,255,255,.85);}
  .kpi.hero .sub{color:rgba(255,255,255,.85);}
  .chg{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;
    padding:2px 8px;border-radius:7px;margin-top:8px;}
  .chg.up{background:rgba(61,220,151,.16);color:var(--good);}
  .chg.down{background:rgba(255,107,129,.16);color:var(--bad);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:0 2px 12px rgba(0,0,0,.18);}
  .card h3{font-size:15px;font-weight:700;margin-bottom:14px;color:#fff;}
  .bars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:18px;}
  .barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .barval{font-size:9px;color:var(--muted);margin-bottom:3px;font-weight:600;white-space:nowrap;}
  .bar{width:100%;background:linear-gradient(180deg,#6b7bff,#4954c9);border-radius:5px 5px 0 0;
    min-height:3px;transition:height .5s ease;}
  .barcol:hover .bar{background:var(--good);}
  .barlabels{display:flex;gap:5px;margin-top:7px;}
  .barlabels span{flex:1;text-align:center;font-size:9px;color:var(--muted);overflow:hidden;white-space:nowrap;}
  .list{display:flex;flex-direction:column;}
  .li{display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--line);gap:10px;}
  .li:last-child{border-bottom:none;}
  .li .rank{width:23px;height:23px;border-radius:7px;background:var(--accent-soft);color:#cdd2ff;
    font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-right:10px;flex-shrink:0;}
  .li .nm{display:flex;align-items:center;}
  .li .name{font-weight:600;font-size:14px;color:var(--ink);}
  .li .meta{font-size:12px;color:var(--muted);}
  .li .amt{font-weight:700;font-size:14px;white-space:nowrap;color:#fff;}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;}
  .tag.good{background:rgba(61,220,151,.16);color:var(--good);}
  .tag.warn{background:rgba(245,185,77,.16);color:var(--warn);}
  .tag.bad{background:rgba(255,107,129,.16);color:var(--bad);}
  .alert{border-radius:14px;padding:15px 16px;margin-bottom:11px;border:1px solid var(--line);
    background:var(--panel);box-shadow:0 2px 12px rgba(0,0,0,.18);}
  .alert .t{font-weight:700;font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:8px;color:#fff;}
  .alert .d{font-size:13px;color:var(--muted);line-height:1.6;}
  .alert.high{border-left:4px solid var(--bad);}
  .alert.medium{border-left:4px solid var(--warn);}
  .alert.low{border-left:4px solid var(--accent);}
  .alert.sug{border-left:4px solid var(--good);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.bad{background:var(--bad);}.dot.warn{background:var(--warn);}
  .dot.low{background:var(--accent);}.dot.good{background:var(--good);}
  #chatwrap{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(35,38,79,.95);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px;
    padding-bottom:max(10px,env(safe-area-inset-bottom));}
  #chatwrap .inner{max-width:1040px;margin:0 auto;display:flex;gap:8px;}
  #msg{flex:1;background:var(--navy);border:1px solid var(--line);border-radius:11px;padding:12px 14px;
    font-size:14px;outline:none;font-family:inherit;color:var(--ink);}
  #msg::placeholder{color:var(--muted);}
  #msg:focus{border-color:var(--accent);}
  #send{background:var(--accent);color:#fff;border:none;border-radius:11px;
    padding:0 20px;font-weight:700;cursor:pointer;font-size:14px;}
  #send:disabled{opacity:.5;}
  .chatlog{max-width:1040px;margin:0 auto 14px;display:none;flex-direction:column;gap:10px;}
  .chatlog.open{display:flex;}
  .bubble{padding:12px 15px;border-radius:14px;font-size:14px;line-height:1.6;max-width:90%;white-space:pre-wrap;}
  .bubble.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .bubble.ai{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px;}
  .ai-hint{font-size:12px;color:var(--muted);text-align:center;margin:8px 0;}
  .loading{text-align:center;color:var(--muted);padding:60px 0;font-size:14px;}
  .overlay{position:fixed;inset:0;background:rgba(10,11,30,.7);z-index:100;display:none;
    align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
  .overlay.open{display:flex;}
  .modal{background:var(--navy);width:100%;max-width:600px;max-height:88vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:22px 20px 30px;border-top:1px solid var(--line);}
  @media(min-width:680px){.overlay{align-items:center;}.modal{border-radius:20px;border:1px solid var(--line);}}
  .modal h2{font-size:20px;font-weight:800;margin-bottom:4px;color:#fff;}
  .modal .date{color:var(--muted);font-size:13px;margin-bottom:18px;}
  .modal .close{float:right;background:var(--panel);border:1px solid var(--line);
    width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;color:var(--muted);}
  .rep-block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:11px;}
  .rep-block .rt{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
  .rep-line{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;}
  .rep-line .k{color:var(--muted);} .rep-line .v{font-weight:700;color:#fff;}
</style>
</head>

    <input id="msg" placeholder="AI asistana sor: bugün nasıl gitti?" autocomplete="off">

<script>
const T = {
  tr:{revenue:"Ciro",profit:"Kâr",margin:"Kâr Marjı",avgticket:"Ort. Adisyon",
    tickets:"adisyon",sales:"SATIŞ ÖZETİ",byday:"Günlük Ciro (son 14 gün)",bypay:"Ödeme Tipleri",
    products:"ÜRÜN RAPORU",topsell:"En Çok Satanlar",topprofit:"En Kârlılar",
    hourly:"SAAT RAPORU",peak:"En yoğun saat",stock:"STOK UYARILARI",refunds:"İADE / İPTAL",
    refundrate:"İade oranı",suggestions:"KÂR ARTIRICI ÖNERİLER",anomalies:"KAÇAK / ANOMALİ UYARILARI",
    nostock:"Kritik stok yok. Her şey yolunda.",noanom:"Anormallik tespit edilmedi.",
    critical:"KRİTİK",warn:"AZALDI",ask:"AI asistana sor: bugün nasıl gitti?",send:"Sor",
    units:"adet",remaining:"kaldı",of:"/",refreshNote:"dk'da bir otomatik yenilenir",thinking:"düşünüyor...",
    vsYesterday:"düne göre",vsWeek:"geçen haftaya göre",report:"Gün Sonu",
    repTitle:"Gün Sonu Raporu",repSales:"SATIŞ",repTop:"EN ÇOK SATAN",repPeak:"YOĞUN SAAT",
    repAction:"ÖNERİLEN AKSİYON"},
  en:{revenue:"Revenue",profit:"Profit",margin:"Profit Margin",avgticket:"Avg. Ticket",
    tickets:"tickets",sales:"SALES SUMMARY",byday:"Daily Revenue (last 14 days)",bypay:"Payment Types",
    products:"PRODUCT REPORT",topsell:"Top Sellers",topprofit:"Most Profitable",
    hourly:"HOURLY REPORT",peak:"Peak hour",stock:"STOCK ALERTS",refunds:"REFUNDS / VOIDS",
    refundrate:"Refund rate",suggestions:"PROFIT SUGGESTIONS",anomalies:"LEAK / ANOMALY ALERTS",
    nostock:"No critical stock. All good.",noanom:"No anomalies detected.",
    critical:"CRITICAL",warn:"LOW",ask:"Ask the AI: how did today go?",send:"Ask",
    units:"units",remaining:"left",of:"of",refreshNote:"auto-refreshes every min",thinking:"thinking...",
    vsYesterday:"vs yesterday",vsWeek:"vs last week",report:"Day Report",
    repTitle:"End of Day Report",repSales:"SALES",repTop:"TOP SELLER",repPeak:"PEAK HOUR",
    repAction:"SUGGESTED ACTION"}
};
let lang="tr",DATA=null;
const fmt=n=>new Intl.NumberFormat(lang==="tr"?"tr-TR":"en-US").format(Math.round(n));
const money=n=>fmt(n)+" TL";
const k=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+"K":Math.round(n);
async function load(){
  try{const r=await fetch("/api/report");DATA=await r.json();render();}
  catch(e){document.getElementById("content").innerHTML="<div class='loading'>Veri alınamadı.</div>";}
}
function chgBadge(p){
  if(p===0) return "";
  const up=p>0;const cls=up?"up":"down";const arr=up?"\u25B2":"\u25BC";
  return '<span class="chg '+cls+'">'+arr+' %'+Math.abs(p)+'</span>';
}
function render(){
  const t=T[lang],d=DATA,s=d.sales,c=d.comparison||{};
  document.getElementById("modepill").textContent=d.mode==="live"?"CANLI":"DEMO";
  document.getElementById("langbtn").textContent=lang==="tr"?"EN":"TR";
  document.getElementById("reportbtn").textContent=t.report;
  document.getElementById("msg").placeholder=t.ask;
  document.getElementById("send").textContent=t.send;
  document.documentElement.lang=lang;
  let html="";
  html+='<div class="row kpis">'+
    '<div class="kpi hero"><div class="label">'+t.revenue+'</div><div class="val">'+money(s.revenue)+'</div><div class="sub">'+s.ticket_count+' '+t.tickets+'</div></div>'+
    '<div class="kpi"><div class="label">'+t.profit+'</div><div class="val">'+money(s.profit)+'</div><div class="sub">'+t.margin+': %'+s.margin_pct+'</div></div>'+
    '<div class="kpi"><div class="label">'+t.margin+'</div><div class="val">%'+s.margin_pct+'</div>'+(c.week_change_pct!==undefined?chgBadge(c.week_change_pct):"")+'<div class="sub">'+t.vsWeek+'</div></div>'+
    '<div class="kpi"><div class="label">'+t.avgticket+'</div><div class="val">'+money(s.avg_ticket)+'</div>'+(c.change_pct!==undefined?chgBadge(c.change_pct):"")+'<div class="sub">'+t.vsYesterday+'</div></div></div>';
  const days=s.by_day.slice(-14),maxd=Math.max(...days.map(x=>x.total),1);
  html+='<h2 class="section">'+t.sales+'</h2><div class="card"><h3>'+t.byday+'</h3><div class="bars">'+
    days.map(x=>'<div class="barcol" title="'+x.day+': '+money(x.total)+'"><span class="barval">'+k(x.total)+'</span><div class="bar" style="height:'+Math.max(3,x.total/maxd*100)+'%"></div></div>').join("")+
    '</div><div class="barlabels">'+days.map(x=>'<span>'+x.day.slice(5)+'</span>').join("")+'</div></div>';
  html+='<div class="card" style="margin-top:12px"><h3>'+t.bypay+'</h3><div class="list">';
  s.by_payment.forEach(p=>{html+='<div class="li"><span class="name">'+p.type+'</span><span class="amt">'+money(p.total)+'</span></div>';});
  html+='</div></div>';
  html+='<h2 class="section">'+t.products+'</h2><div class="card"><h3>'+t.topsell+'</h3><div class="list">';
  d.products.top_sellers.forEach((i,ix)=>{html+='<div class="li"><div class="nm"><span class="rank">'+(ix+1)+'</span><div><div class="name">'+i.name+'</div><div class="meta">'+i.category+' | %'+i.margin_pct+'</div></div></div><span class="amt">'+i.qty+' '+t.units+'</span></div>';});
  html+='</div></div><div class="card" style="margin-top:12px"><h3>'+t.topprofit+'</h3><div class="list">';
  d.products.top_profit.forEach((i,ix)=>{html+='<div class="li"><div class="nm"><span class="rank">'+(ix+1)+'</span><div><div class="name">'+i.name+'</div><div class="meta">'+i.qty+' '+t.units+'</div></div></div><span class="amt">'+money(i.profit)+'</span></div>';});
  html+='</div></div>';
  const hrs=d.hourly.hours,maxh=Math.max(...hrs.map(x=>x.revenue),1);
  html+='<h2 class="section">'+t.hourly+'</h2><div class="card"><h3>'+t.peak+': '+d.hourly.peak_hour+'</h3><div class="bars">'+
    hrs.map(x=>'<div class="barcol" title="'+x.hour+': '+money(x.revenue)+'"><div class="bar" style="height:'+Math.max(3,x.revenue/maxh*100)+'%"></div></div>').join("")+
    '</div><div class="barlabels">'+hrs.map(x=>'<span>'+x.hour.slice(0,2)+'</span>').join("")+'</div></div>';
  html+='<h2 class="section">'+t.anomalies+'</h2>';
  if(d.anomalies.length===0){html+='<div class="alert"><div class="d">'+t.noanom+'</div></div>';}
  else{d.anomalies.forEach(a=>{html+='<div class="alert '+a.level+'"><div class="t"><span class="dot '+(a.level==='high'?'bad':a.level==='medium'?'warn':'low')+'"></span>'+a.title+'</div><div class="d">'+a.detail+'</div></div>';});}
  html+='<h2 class="section">'+t.suggestions+'</h2>';
  d.suggestions.forEach(sg=>{html+='<div class="alert sug"><div class="t"><span class="dot good"></span>'+sg.title+'</div><div class="d">'+sg.detail+'</div></div>';});
  html+='<h2 class="section">'+t.stock+'</h2>';
  if(d.stock_alerts.length===0){html+='<div class="alert"><div class="d">'+t.nostock+'</div></div>';}
  else{html+='<div class="card"><div class="list">';
    d.stock_alerts.forEach(a=>{const cls=a.severity==="critical"?"bad":"warn",lbl=a.severity==="critical"?t.critical:t.warn;
      html+='<div class="li"><div><div class="name">'+a.item+'</div><div class="meta">'+a.current+' '+a.unit+' '+t.remaining+' '+t.of+' '+a.critical+' '+a.unit+'</div></div><span class="tag '+cls+'">'+lbl+'</span></div>';});
    html+='</div></div>';}
  html+='<h2 class="section">'+t.refunds+'</h2><div class="row kpis"><div class="kpi"><div class="label">'+t.refundrate+'</div><div class="val">%'+d.refunds.void_rate_pct+'</div><div class="sub">'+money(d.refunds.void_total)+'</div></div></div>';
  html+='<p class="ai-hint" style="margin-top:18px">'+d.refresh_minutes+' '+t.refreshNote+'</p>';
  document.getElementById("content").innerHTML=html;
}
function showReport(){
  const t=T[lang],d=DATA,s=d.sales,c=d.comparison||{};
  const top=d.products.top_sellers[0]||{name:"-",qty:0};
  const act=d.suggestions[0];const anom=d.anomalies[0];
  let h='<button class="close" id="closebtn">x</button><h2>'+t.repTitle+'</h2><div class="date">'+(c.last_date||"")+'</div>'+
    '<div class="rep-block"><div class="rt">'+t.repSales+'</div>'+
    '<div class="rep-line"><span class="k">'+t.revenue+'</span><span class="v">'+money(s.revenue)+' '+chgBadge(c.week_change_pct||0)+'</span></div>'+
    '<div class="rep-line"><span class="k">'+t.profit+'</span><span class="v">'+money(s.profit)+' (%'+s.margin_pct+')</span></div>'+
    '<div class="rep-line"><span class="k">'+t.avgticket+'</span><span class="v">'+money(s.avg_ticket)+'</span></div></div>'+
    '<div class="rep-block"><div class="rt">'+t.repTop+'</div><div class="rep-line"><span class="k">'+top.name+'</span><span class="v">'+top.qty+' '+t.units+'</span></div></div>'+
    '<div class="rep-block"><div class="rt">'+t.repPeak+'</div><div class="rep-line"><span class="k">'+t.peak+'</span><span class="v">'+d.hourly.peak_hour+'</span></div></div>';
  if(anom){h+='<div class="rep-block" style="border-left:4px solid var(--bad)"><div class="rt" style="color:var(--bad)">'+t.anomalies+'</div><div class="d" style="font-size:13px;color:var(--muted);line-height:1.5">'+anom.detail+'</div></div>';}
  if(act){h+='<div class="rep-block" style="border-left:4px solid var(--good)"><div class="rt" style="color:var(--good)">'+t.repAction+'</div><div class="d" style="font-size:13px;color:var(--muted);line-height:1.5">'+act.detail+'</div></div>';}
  document.getElementById("modal").innerHTML=h;
  document.getElementById("overlay").classList.add("open");
  document.getElementById("closebtn").onclick=()=>document.getElementById("overlay").classList.remove("open");
}
document.getElementById("reportbtn").onclick=showReport;
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")document.getElementById("overlay").classList.remove("open");};
document.getElementById("langbtn").onclick=()=>{lang=lang==="tr"?"en":"tr";if(DATA)render();};
const log=document.getElementById("chatlog"),msg=document.getElementById("msg"),send=document.getElementById("send");
function addBubble(text,who){log.classList.add("open");const b=document.createElement("div");b.className="bubble "+who;b.textContent=text;log.appendChild(b);b.scrollIntoView({behavior:"smooth"});return b;}
async function ask(){
  const text=msg.value.trim();if(!text)return;
  addBubble(text,"me");msg.value="";send.disabled=true;
  const thinking=addBubble(T[lang].thinking,"ai");
  try{const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message:text,lang})});
    const dd=await r.json();thinking.textContent=dd.answer;}
  catch(e){thinking.textContent="Bağlantı hatası.";}
  send.disabled=false;
}
send.onclick=ask;
msg.onkeydown=e=>{if(e.key==="Enter")ask();};
load();
setInterval(load,5*60*1000);
</script>
</body>
