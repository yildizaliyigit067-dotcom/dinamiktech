<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dinamik Tech</title><style>
:root{
  --bg:#070b1c; --bg2:#0a0f24; --side:#080c1d; --card:#0f1430; --card2:#131a3c;
  --line:#1d2547; --line2:#283157; --ink:#f4f6ff; --t2:#a7afd6; --t3:#646c98;
  --accent:#4d7cfe; --accL:#7ba0ff; --accD:rgba(77,124,254,.13);
  --good:#1fd896; --warn:#ffb84d; --bad:#ff5e7a; --gold:#e7c46b;
  --shadow:0 8px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);
  font-family:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;
  letter-spacing:-.01em;}
body{background-image:
  radial-gradient(900px circle at 12% -5%,rgba(77,124,254,.10),transparent 45%),
  radial-gradient(700px circle at 95% 0%,rgba(31,216,150,.05),transparent 40%);
  background-attachment:fixed;}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
.app{display:flex;min-height:100vh}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.22,1,.36,1) both}
.d1{animation-delay:.04s}.d2{animation-delay:.09s}.d3{animation-delay:.14s}.d4{animation-delay:.19s}.d5{animation-delay:.24s}.d6{animation-delay:.29s}
/* SIDEBAR */
.side{width:236px;background:linear-gradient(180deg,var(--side),#070b1c);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand img{height:23px;display:block}
.brand .pw{font-size:8.5px;letter-spacing:2.5px;color:var(--t3);margin-top:9px;font-weight:600}
.nav{padding:16px 13px;flex:1}
.navlbl{font-size:9.5px;letter-spacing:1.4px;color:var(--t3);font-weight:700;padding:0 13px;margin:8px 0 9px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;
  background:transparent;border:none;cursor:pointer;text-align:left;color:var(--t2);font-size:13.5px;font-weight:500;
  font-family:inherit;margin-bottom:2px;transition:all .18s;position:relative}
.nav button:hover{background:var(--card);color:var(--ink)}
.nav button.on{background:linear-gradient(90deg,var(--accD),transparent);color:#fff;font-weight:600}
.nav button.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.nav .ic{width:17px;height:17px;flex-shrink:0}
.user{padding:15px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:11px}
.user .av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accL));
  display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;box-shadow:0 4px 12px rgba(77,124,254,.4)}
.user .nm{font-size:13px;font-weight:700}.user .sub{font-size:11px;color:var(--t3)}
/* MAIN */
.main{flex:1;margin-left:236px;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:17px 28px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,11,28,.82);backdrop-filter:blur(14px);z-index:30}
.topbar .dt{font-size:12.5px;color:var(--t2);font-variant-numeric:tabular-nums}
.topbar .right{display:flex;align-items:center;gap:11px}
.pill{font-size:10.5px;padding:6px 12px;border-radius:20px;font-weight:700;letter-spacing:.3px}
.pill.demo{background:rgba(31,216,150,.13);color:var(--good);border:1px solid rgba(31,216,150,.25)}
.lang{background:var(--card);border:1px solid var(--line2);color:#fff;border-radius:10px;padding:7px 13px;
  font-size:12px;cursor:pointer;font-weight:600;transition:.15s}.lang:hover{border-color:var(--accent)}
.lang b{color:var(--accL)}.lang span{color:var(--t3)}
.content{padding:26px 28px 48px;max-width:1320px}
.h1{font-size:25px;font-weight:800;letter-spacing:-.8px}
.sub{font-size:13px;color:var(--t3);margin-top:4px;margin-bottom:24px;display:flex;align-items:center;gap:7px}
.sub .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(31,216,150,.18)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:19px 19px 16px;
  transition:.2s;position:relative;overflow:hidden}
.kpi:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .lb{font-size:10.5px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:11px}
.kpi .vl{font-size:26px;font-weight:800;letter-spacing:-.9px;font-variant-numeric:tabular-nums}
.kpi .ch{font-size:12px;font-weight:700;margin-top:10px;display:inline-flex;align-items:center;gap:4px}
.kpi .ch.up{color:var(--good)}.kpi .ch.down{color:var(--bad)}
.kpi .spark{position:absolute;right:14px;top:16px;opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:18px}
.grid2.wide{grid-template-columns:1.75fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:22px}
.card .ct{font-size:15.5px;font-weight:700;letter-spacing:-.3px}
.card .ctsub{font-size:12px;color:var(--t3);margin-top:2px}
.card .cbig{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:14px 0 18px;font-variant-numeric:tabular-nums}
.card .cbig .up{font-size:13px;color:var(--good);font-weight:700;margin-left:9px}
.chart{width:100%;height:190px;display:block}
.li{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .nm{display:flex;align-items:center;gap:13px}
.li .rk{width:28px;height:28px;border-radius:9px;background:var(--accD);color:var(--accL);font-size:11px;
  font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.li .nmt{font-size:13.5px;font-weight:600}.li .nms{font-size:11px;color:var(--t3);margin-top:1px}
.li .amt{font-size:14px;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}
.pay .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:var(--t2)}
.pay .row b{color:#fff;font-variant-numeric:tabular-nums}
.pay .track{height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;margin-bottom:17px}
.pay .fill{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.aimgr{background:linear-gradient(140deg,rgba(77,124,254,.10),rgba(77,124,254,.01));
  border:1px solid var(--line2);border-radius:17px;padding:22px;position:relative;overflow:hidden}
.aimgr::after{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;
  background:radial-gradient(circle,rgba(77,124,254,.18),transparent 70%)}
.aimgr .h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--accL);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px}
.aimgr .it{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--t2);line-height:1.55;margin-bottom:13px;position:relative}
.aimgr .it .d{width:7px;height:7px;border-radius:50%;margin-top:6px;flex-shrink:0}
.tag{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:8px}
.tag.bad{background:rgba(255,94,122,.15);color:var(--bad)}.tag.warn{background:rgba(255,184,77,.15);color:var(--warn)}
.mtitle{font-size:10.5px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:26px 2px 14px}
.alert{border-radius:14px;padding:16px 17px;margin-bottom:12px;border:1px solid var(--line);background:var(--card);transition:.2s}
.alert:hover{border-color:var(--line2)}
.alert.l{border-left:3px solid var(--accent)}.alert.bad{border-left:3px solid var(--bad)}
.alert.warn{border-left:3px solid var(--warn)}.alert.good{border-left:3px solid var(--good)}
.alert .t{font-weight:700;font-size:14px;margin-bottom:6px}.alert .d{font-size:13px;color:var(--t2);line-height:1.6}
.loading{text-align:center;color:var(--t3);padding:80px;font-size:14px}
/* AI chat */
.chatbox{display:flex;flex-direction:column;height:calc(100vh - 200px)}
.chatlog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:6px}
.bub{max-width:74%;padding:13px 17px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;animation:rise .3s ease both}
.bub.me{background:linear-gradient(135deg,#3463ea,var(--accent));color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bub.ai{background:var(--card2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.quick button{padding:8px 14px;border-radius:18px;background:var(--accD);border:1px solid rgba(77,124,254,.22);
  color:var(--accL);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s}
.quick button:hover{background:rgba(77,124,254,.2)}
.chatin{display:flex;gap:10px;margin-top:15px}
.chatin input{flex:1;background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:14px 17px;
  color:var(--ink);font-size:14px;outline:none;font-family:inherit;transition:.15s}.chatin input:focus{border-color:var(--accent)}
.chatin button{background:var(--accent);color:#fff;border:none;border-radius:13px;padding:0 24px;font-weight:700;
  cursor:pointer;transition:.15s}.chatin button:hover{background:#5d89ff}
.burger{display:none}
@media(max-width:860px){
  .side{transform:translateX(-100%);transition:.25s;width:252px}.side.open{transform:translateX(0)}
  .main{margin-left:0}.burger{display:flex;background:var(--card);border:1px solid var(--line2);color:#fff;
    width:38px;height:38px;border-radius:10px;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
  .kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid2.wide{grid-template-columns:1fr}
  .content{padding:18px 16px}.topbar{padding:13px 16px}.h1{font-size:21px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;display:none}.scrim.open{display:block}
}

// SVG area chart
function areaChart(vals,h,color){
  color=color||"#4d7cfe";const w=600;const max=Math.max(...vals,1),min=Math.min(...vals,0);
  const rng=max-min||1;const pad=10;const ih=h-pad*2;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,pad+ih-(v-min)/rng*ih]);
  const line=pts.map((p,i)=>{if(i===0)return"M"+p[0]+","+p[1];const pr=pts[i-1];const cx=(pr[0]+p[0])/2;return "C"+cx+","+pr[1]+" "+cx+","+p[1]+" "+p[0]+","+p[1];}).join(" ");
  const area=line+" L"+w+","+h+" L0,"+h+" Z";
  const id="g"+Math.random().toString(36).slice(2,7);
  return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+color+'" stop-opacity=".35"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+id+')"/><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round"/>'+
    pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="0"/>').join("")+'</svg>';
}
function sparkline(vals,color){color=color||"#1fd896";const w=64,h=26;const max=Math.max(...vals,1),min=Math.min(...vals,0),rng=max-min||1;
  const pts=vals.map((v,i)=>(i/(vals.length-1)*w)+","+(h-(v-min)/rng*h)).join(" ");
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';}

    MANAGE.ingredients.forEach((g,i)=>{
      h+='<div class="li"><div style="flex:1;display:flex;gap:8px;flex-wrap:wrap">'+
        '<input value="'+(g.name||"")+'" placeholder="'+t.mName+'" oninput="MANAGE.ingredients['+i+'].name=this.value" style="flex:2;min-width:110px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:inherit">'+
        '<select onchange="MANAGE.ingredients['+i+'].unit=this.value" style="background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:inherit">'+
          ['kg','adet','lt','gr'].map(u=>'<option '+(g.unit===u?'selected':'')+'>'+u+'</option>').join("")+'</select>'+
        '<input value="'+(g.stock||"")+'" type="number" placeholder="'+t.mStock+'" oninput="MANAGE.ingredients['+i+'].stock=parseFloat(this.value)||0" style="flex:1;min-width:80px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:inherit">'+
        '<input value="'+(g.cost||"")+'" type="number" placeholder="'+t.mCost+'" oninput="MANAGE.ingredients['+i+'].cost=parseFloat(this.value)||0" style="flex:1;min-width:80px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:inherit">'+
        '</div><button onclick="MANAGE.ingredients.splice('+i+',1);mSave();renderMBody()" style="background:none;border:none;color:var(--bad);cursor:pointer;font-size:18px;padding:0 8px">×</button></div>';
    });
    if(MANAGE.ingredients.length===0)h+='<div class="nms" style="color:var(--t3);padding:10px 0">'+t.mEmpty+'</div>';
    h+='<div style="margin-top:14px"><button class="lang" onclick="mSave()" style="background:var(--good);color:#04211a;border:none;font-weight:700">'+t.mSave+'</button></div></div>';
  }
  else if(mTab==="recipes"){
    h+='<div class="card rise"><div class="ct" style="margin-bottom:6px">'+t.mTabRecipes+'</div><div class="ctsub" style="margin-bottom:16px">'+t.mRecipeHint+'</div>';
    if(MANAGE.products.length===0){h+='<div class="nms" style="color:var(--warn)">'+t.mNoProducts+'</div>';}
    else if(MANAGE.ingredients.length===0){h+='<div class="nms" style="color:var(--warn)">'+t.mNoIng+'</div>';}
    else{
      MANAGE.products.forEach(p=>{
        const rec=MANAGE.recipes[p.id]||[];
        h+='<div style="border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px">';
        h+='<div style="font-weight:700;margin-bottom:10px">'+t.mRecipeFor+' '+(p.name||"?")+'</div>';
        rec.forEach((line,li)=>{
          h+='<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">'+
            '<select onchange="MANAGE.recipes[\''+p.id+'\']['+li+'].ingredient_id=this.value" style="flex:2;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);font-family:inherit">'+
              MANAGE.ingredients.map(g=>'<option value="'+g.id+'" '+(line.ingredient_id===g.id?'selected':'')+'>'+g.name+' ('+g.unit+')</option>').join("")+'</select>'+
            '<input value="'+(line.amount||"")+'" type="number" step="0.01" placeholder="'+t.mAmount+'" oninput="MANAGE.recipes[\''+p.id+'\']['+li+'].amount=parseFloat(this.value)||0" style="flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);font-family:inherit">'+
            '<button onclick="MANAGE.recipes[\''+p.id+'\'].splice('+li+',1);renderMBody()" style="background:none;border:none;color:var(--bad);cursor:pointer;font-size:16px">×</button></div>';
        });
        h+='<button class="quick" onclick="mAddRecipeLine(\''+p.id+'\')" style="background:var(--accD);border:1px solid rgba(77,124,254,.2);color:var(--accL);padding:6px 12px;border-radius:14px;cursor:pointer;font-size:12px;font-family:inherit">'+t.mAddLine+'</button>';
        h+='</div>';
      });
      h+='<div style="margin-top:6px"><button class="lang" onclick="mSave()" style="background:var(--good);color:#04211a;border:none;font-weight:700">'+t.mSave+'</button></div>';
    }
    h+='</div>';
  }
  document.getElementById("mBody").innerHTML=h;
}
function mAddProduct(){MANAGE.products.push({id:mGenId("p_"),name:"",category:"",price:0});renderMBody();}
function mAddIng(){MANAGE.ingredients.push({id:mGenId("i_"),name:"",unit:"kg",stock:0,cost:0});renderMBody();}
function mAddRecipeLine(pid){if(!MANAGE.recipes[pid])MANAGE.recipes[pid]=[];MANAGE.recipes[pid].push({ingredient_id:MANAGE.ingredients[0].id,amount:0});renderMBody();}
function renderSettings(){const t=T[lang],d=DATA;
  document.getElementById("content").innerHTML='<div class="h1 rise">'+t.nav.settings+'</div><div class="sub rise d1"><span class="dot"></span></div>'+
    '<div class="card rise d2"><div class="li"><div class="nmt">'+t.setData+'</div><span class="tag '+(d.mode==="live"?"":"warn")+'">'+(d.mode==="live"?t.live:t.demo)+'</span></div>'+
    '<div class="li"><div class="nmt">'+t.setRefresh+'</div><span class="nms" style="color:var(--t2)">'+d.refresh_minutes+' '+t.min+'</span></div></div>';}
document.getElementById("langbtn").onclick=()=>{lang=lang==="tr"?"en":"tr";chatState=null;renderAll();};
document.getElementById("burger").onclick=()=>{document.getElementById("side").classList.add("open");document.getElementById("scrim").classList.add("open");};
document.getElementById("scrim").onclick=()=>{document.getElementById("side").classList.remove("open");document.getElementById("scrim").classList.remove("open");};
load();setInterval(tick,30000);setInterval(load,5*60*1000);
</script></body></html>
