# Render.com — Tek tıkla deploy / One-click deploy
# Bu dosya GitHub repo'na bağlanınca Render otomatik kurar.
# Telefondan: render.com -> New -> Blueprint -> GitHub repo'nu seç.
services:
  - type: web
    name: dinamiktech
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: USE_SAMPLE_DATA
        value: "true"
      - key: REFRESH_MINUTES
        value: "30"
      - key: HISTORY_DAYS
        value: "30"
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-20250514
      # ANTHROPIC_API_KEY'i Render panelinden (Environment) elle gir.
      # Kod içine yazma! Render -> dinamiktech -> Environment -> Add.
      - key: ANTHROPIC_API_KEY
        sync: false
