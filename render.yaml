services:
  - type: web
    name: dinamiktech
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: USE_SAMPLE_DATA
        value: "true"
      - key: REFRESH_MINUTES
        value: "30"
      - key: HISTORY_DAYS
        value: "30"
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-20250514
      - key: ANTHROPIC_API_KEY
        sync: false
